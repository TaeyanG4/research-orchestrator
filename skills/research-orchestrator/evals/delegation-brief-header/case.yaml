schema_version: "1.1"
name: delegation-brief-header
expected_outcome: |
  The agent starts the delegated agent's brief with the output of `ro brief --delegate H-A-01/s1`, so the brief carries the `ro-delegate: v1` marker, the write scope, the no-delete and clock-time rules and the report sections, and it fills in resource limits and the task.
  No delegated agent runs: report.md stands in for its reply. The delegating session records the stage outcome from it with `ro event` instead of hand-writing an event heading, and keeps the report's inferred explanation marked as inferred.
context:
  scaffold_script: place-files.sh
