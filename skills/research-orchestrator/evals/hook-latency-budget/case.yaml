schema_version: "1.1"
name: hook-latency-budget
expected_outcome: |
  Installed supervisor and in-process hooks retain p95 < 150 ms on all hosts; direct-child hook p95 minus bare-interpreter p95 stays below 150 ms and absolute hook p95 stays below 300 ms.
  The audit computes both percentiles, rejects equality at either budget and incorrect output, explains reporting and repeated-batch aggregation, and cites the separate no-history-read guard without modifying measurements.
