<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Classic and unified workflows</title>
  <desc id="desc">Classic: each slot owns an Agent section of plan.md and items change owner only through a logged take-over. An idle source permits one eligible cross-host item after nearer work is exhausted (see workflow-classic.md). Unified: one shared Queue in which every item carries a Claimed line, and ro claim locks, rereads, and writes the claim.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#616e7c" />
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f" />
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="328" rx="14" fill="#f5f7fa" stroke="#cbd2d9" />
  <rect x="24" y="20" width="446" height="290" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" />
  <text x="44" y="50" font-family="Helvetica, Arial, sans-serif" fill="#1f2933" font-size="16px" font-weight="600">Classic</text>
  <text x="44" y="70" font-family="Helvetica, Arial, sans-serif" fill="#52606d" font-size="12px">each slot owns one section of plan.md</text>
  <rect x="44" y="86" width="270" height="168" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.2" />
  <text x="56" y="104" font-family="Helvetica, Arial, sans-serif" fill="#52606d" font-size="12px">plan.md</text>
  <text x="56" y="130" fill="#2f6fde" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5px" font-weight="700">## Agent: A</text>
  <text x="72" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" fill="#1f2933" font-size="12.5px">H-A-01</text>
  <text x="72" y="172" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" fill="#1f2933" font-size="12.5px">H-A-02</text>
  <text x="56" y="204" fill="#2f855a" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5px" font-weight="700">## Agent: B</text>
  <text x="72" y="226" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" fill="#1f2933" font-size="12.5px">H-B-01</text>
  <text x="72" y="246" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" fill="#1f2933" font-size="12.5px">H-B-02</text>
  <path d="M132,242 C200,236 200,186 136,178" stroke="#b7791f" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#amber)" />
  <text x="200" y="214" font-family="Helvetica, Arial, sans-serif" fill="#52606d" font-size="12px">logged take-over</text>
  <circle cx="374" cy="130" r="16" fill="#2f6fde" />
  <text x="374" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#ffffff" font-size="14px" font-weight="700">A</text>
  <circle cx="374" cy="204" r="16" fill="#2f855a" />
  <text x="374" y="209" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#ffffff" font-size="14px" font-weight="700">B</text>
  <path d="M356,130 H318" stroke="#616e7c" stroke-width="1.8" fill="none" marker-end="url(#head)" />
  <path d="M356,204 H318" stroke="#616e7c" stroke-width="1.8" fill="none" marker-end="url(#head)" />
  <text x="44" y="280" font-family="Helvetica, Arial, sans-serif" fill="#52606d" font-size="12px">reads only its own detailed section;</text>
  <a href="../../skills/research-orchestrator/references/workflow-classic.md#cross-host-take-over-by-judgment"><text x="44" y="297" font-family="Helvetica, Arial, sans-serif" fill="#52606d" font-size="12px">normally stay with host; one-item exception</text></a>
  <rect x="490" y="20" width="446" height="290" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" />
  <text x="510" y="50" font-family="Helvetica, Arial, sans-serif" fill="#1f2933" font-size="16px" font-weight="600">Unified</text>
  <text x="510" y="70" font-family="Helvetica, Arial, sans-serif" fill="#52606d" font-size="12px">one shared queue; Claimed lines show who is working on what</text>
  <rect x="510" y="86" width="300" height="168" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.2" />
  <text x="522" y="104" font-family="Helvetica, Arial, sans-serif" fill="#52606d" font-size="12px">plan.md</text>
  <text x="522" y="130" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" fill="#1f2933" font-size="12.5px" font-weight="700">## Queue</text>
  <rect x="516" y="140" width="288" height="20" rx="4" fill="#e3ecfd" />
  <text x="522" y="155" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" fill="#1f2933" font-size="12.5px">H-A-01  Claimed: A since 09:10</text>
  <text x="522" y="179" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" fill="#1f2933" font-size="12.5px">H-B-02  Claimed: none</text>
  <rect x="516" y="188" width="288" height="20" rx="4" fill="#e2f3e8" />
  <text x="522" y="203" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" fill="#1f2933" font-size="12.5px">H-A-03  Claimed: B since 10:05</text>
  <text x="522" y="227" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" fill="#1f2933" font-size="12.5px">H-B-04  Claimed: none</text>
  <circle cx="874" cy="150" r="16" fill="#2f6fde" />
  <text x="874" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#ffffff" font-size="14px" font-weight="700">A</text>
  <circle cx="874" cy="198" r="16" fill="#2f855a" />
  <text x="874" y="203" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#ffffff" font-size="14px" font-weight="700">B</text>
  <path d="M856,150 H814" stroke="#616e7c" stroke-width="1.8" fill="none" marker-end="url(#head)" />
  <path d="M856,198 H814" stroke="#616e7c" stroke-width="1.8" fill="none" marker-end="url(#head)" />
  <text x="510" y="280" font-family="Helvetica, Arial, sans-serif" fill="#52606d" font-size="12px">ro claim locks, rereads, then writes the claim;</text>
  <text x="510" y="297" font-family="Helvetica, Arial, sans-serif" fill="#52606d" font-size="12px">anyone may refine an unclaimed item</text>
</svg>
